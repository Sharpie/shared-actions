---
name: Publish package to clojars.org

on:
  workflow_call:
    inputs:
      base-branch:
        description: 'The branch to release from. Leave empty for default branch.'
        type: string
        required: false
        default: ''
      java-version:
        description: 'The java version to use when building the jar.'
        type: string
        required: false
        default: '17'
    secrets:
      github_pat:
        # Provide a fine-grained token with the following repository permissions:
        # * Contents: Read and write
        # * Metadata: Read-only (mandatory, default)
        # * Pull requests: Read and write
        description: 'The token used to interact with GitHub'
        required: true
      ssh_private_key:
        description: 'The SSH private key used to sign commits and tags.'
        required: true
      clojars_username:
        description: 'The username for clojars.org'
        required: true
      clojars_password:
        description: 'The password for clojars.org'
        required: true

env:
  GIT_AUTHOR_NAME: OpenVoxProjectBot
  GIT_AUTHOR_EMAIL: 215568489+OpenVoxProjectBot@users.noreply.github.com
  GIT_COMMITTER_NAME: OpenVoxProjectBot
  GIT_COMMITTER_EMAIL: 215568489+OpenVoxProjectBot@users.noreply.github.com
  SSH_AUTH_SOCK: /tmp/ssh_agent.sock

jobs:
  release:
    runs-on: ubuntu-24.04
    # `environment` enables better auditing and fine grained permissions
    # https://docs.github.com/en/actions/how-tos/deploy/configure-and-manage-deployments/control-deployments
    environment: release
    if: github.repository_owner == 'OpenVoxProject'
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base-branch }}
          fetch-depth: 0
          token: ${{ secrets.github_pat }}

      - name: Setup java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: ${{ inputs.java-version }}
          distribution: temurin

      - name: Install clojure tools
        uses: DeLaGuardo/setup-clojure@4c7a6f613e5089821bb3bb2a33a3ee115578580d # 13.6.1
        with:
          lein: 'latest'

      - name: Get and validate release version
        id: version
        run: |
          project_version="$(lein update-in :plugins conj '[lein-pprint "1.3.2"]' -- pprint :version | tr -d '"')"

          if [[ "$project_version" != *-SNAPSHOT ]]; then
            echo "::error file=project.clj::Version '$project_version' must end with '-SNAPSHOT'."
            exit 1
          fi

          printf 'version=%s\n' "${project_version%-SNAPSHOT}" >> "$GITHUB_OUTPUT"

      - name: Check tag doesn't already exist
        run: |
          if git rev-parse "${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "::error::Tag '${{ steps.version.outputs.version }}' already exists!"
            exit 1
          fi

      - name: Add SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ssh_private_key }}" > ~/.ssh/github_actions
          chmod 600 ~/.ssh/github_actions
          ssh-agent -a $SSH_AUTH_SOCK > /dev/null
          ssh-add ~/.ssh/github_actions

      - name: Setup git
        run: |
          git config --global user.email "$GIT_AUTHOR_EMAIL"
          git config --global user.name "$GIT_AUTHOR_NAME"
          git config --global gpg.format ssh
          git config --global user.signingkey ~/.ssh/github_actions
          git config --global commit.gpgsign true
          git config --global tag.gpgsign true

      # The steps in 'lein release' are:
      # 1. Ensure no uncommitted changes
      # 2. Drop -SNAPSHOT from version in project.clj
      # 3. Commit version change
      # 4. Tag release
      # 5. Deploy to repositories (clojars.org in our case)
      # 6. Bump version to next SNAPSHOT
      # 7. Commit version change
      # 8. Push commits and tags
      - name: Release and publish to clojars.org
        run: lein release
        env:
          CLOJARS_USERNAME: ${{ secrets.clojars_username }}
          CLOJARS_PASSWORD: ${{ secrets.clojars_password }}

      - name: Create Release Page
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.github_pat }}
        run: |
          gh release create \
            --repo ${{ github.repository }} \
            ${{ steps.version.outputs.version }} \
            --generate-notes \
            --verify-tag
