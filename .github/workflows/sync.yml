name: Sync any source updates

on:
  workflow_call:
    inputs:
      upstream_owner:
        description: GitHub owner of the upstream repository with the same name
        required: false
        default: puppetlabs
        type: string
    secrets:
      WORKFLOW_TOKEN:
        description: Optional token used instead of GITHUB_TOKEN for protected refs
        required: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        token: ${{ secrets.WORKFLOW_TOKEN || github.token }}

    - name: Back up and sync all updates
      shell: bash
      env:
        REPOSITORY_NAME: ${{ github.event.repository.name }}
        UPSTREAM_OWNER: ${{ inputs.upstream_owner }}
      run: |
        set -euo pipefail

        upstream_repository="${UPSTREAM_OWNER}/${REPOSITORY_NAME}"
        git remote add upstream "https://github.com/${upstream_repository}.git"
        git fetch --prune upstream

        today=$(date -u -I)
        for branch in $(git for-each-ref --format='%(refname)' refs/remotes/upstream)
        do
          name="${branch#refs/remotes/upstream/}"

          if [[ "${name}" == HEAD ]]; then
            continue
          fi

          echo "Syncing ${name} from upstream/${name} to origin/${name}"

          backup="backup/${today}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/${name}"
          git branch "${backup}" "${branch}"
          git push origin "refs/heads/${backup}"

          echo "pushing ${name} to origin/${name}"
          git push origin "+${branch}:refs/heads/${name}"
        done

        git push origin --tags
